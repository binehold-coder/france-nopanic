[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nopanic"
version = "0.1.0"
description = "Франція без паніки — Telegram-бот, що пояснює французькі листи"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "anthropic>=2.0,<3",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["nopanic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
